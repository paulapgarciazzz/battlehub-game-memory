name: Build y pruebas unitarias

# Segundo workflow (R-21): solo compila y corre las pruebas unitarias.
# El workflow CI hace el resto (lint, integración, cobertura y docker build).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend
        run: dotnet build src/BattleHub.Memory.slnx --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/BattleHub.Memory.UnitTests/BattleHub.Memory.UnitTests.csproj
          --no-build
          --configuration Release

  frontend:
    name: Frontend (Aurelia)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/memory-microfrontend/memory-game

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: src/memory-microfrontend/memory-game/.nvmrc
          cache: npm
          cache-dependency-path: src/memory-microfrontend/memory-game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --ci