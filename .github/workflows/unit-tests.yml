name: Unit Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/BattleHub.Memory.slnx

      - name: Build solution
        run: dotnet build src/BattleHub.Memory.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/BattleHub.Memory.UnitTests/BattleHub.Memory.UnitTests.csproj
          --no-build
          --configuration Release
