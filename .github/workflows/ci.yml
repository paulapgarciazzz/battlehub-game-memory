name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for .NET project files
        id: check-dotnet
        run: |
          if find src -name "*.csproj" -o -name "*.sln" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontraron proyectos .NET en src/ todavía. Se omite build/test."
          fi

      - name: Setup .NET 10
        if: steps.check-dotnet.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet restore
        working-directory: src

      - name: Build
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release
        working-directory: src

      - name: Test
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release
        working-directory: src

  frontend:
    name: Build & test (Aurelia microfrontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/memory-microfrontend/memory-game
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check-node
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontró package.json en memory-microfrontend/memory-game. Se omite build/test."
          fi

      - name: Setup Node
        if: steps.check-node.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          # Node 24 LTS desde .nvmrc (ADR-003 §1).
          node-version-file: src/memory-microfrontend/memory-game/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/memory-microfrontend/memory-game/package-lock.json

      - name: Install
        if: steps.check-node.outputs.found == 'true'
        run: npm ci

      - name: Lint
        if: steps.check-node.outputs.found == 'true'
        run: npm run lint

      - name: Build
        if: steps.check-node.outputs.found == 'true'
        run: npm run build

      # npm test también corre el lint (pretest); aquí ya se corrió arriba.
      - name: Test
        if: steps.check-node.outputs.found == 'true'
        run: npx jest --ci
