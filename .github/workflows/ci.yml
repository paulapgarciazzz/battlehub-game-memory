name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: src

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: src

      - name: Test
        run: dotnet test --no-build --configuration Release
        working-directory: src

  frontend:
    name: Build & test (Aurelia microfrontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/memory-microfrontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/memory-microfrontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
