name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for .NET project files
        id: check-dotnet
        run: |
          if find src -name "*.csproj" -o -name "*.sln" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontraron proyectos .NET en src/ todavía. Se omite build/test."
          fi

      - name: Setup .NET 10
        if: steps.check-dotnet.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet restore
        working-directory: src

      - name: Build
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release
        working-directory: src

      - name: Test
        if: steps.check-dotnet.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults
        working-directory: src

      - name: Merge backend coverage
        if: always() && steps.check-dotnet.outputs.found == 'true'
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path .tools --version 5.4.4
          ./.tools/reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-merged" "-reporttypes:Cobertura"
        working-directory: src

      - name: Upload backend coverage
        if: always() && steps.check-dotnet.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: src/coverage-merged/Cobertura.xml
          if-no-files-found: warn

  frontend:
    name: Build & test (Aurelia microfrontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/memory-microfrontend/memory-game
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check-node
        run: |
          if [ -f "package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontró package.json en memory-microfrontend/memory-game. Se omite build/test."
          fi

      - name: Setup Node
        if: steps.check-node.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS desde .nvmrc (requisito R-42).
          node-version-file: src/memory-microfrontend/memory-game/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/memory-microfrontend/memory-game/package-lock.json

      - name: Install
        if: steps.check-node.outputs.found == 'true'
        run: npm ci

      - name: Lint
        if: steps.check-node.outputs.found == 'true'
        run: npm run lint

      - name: Build
        if: steps.check-node.outputs.found == 'true'
        run: npm run build

      # npm test también corre el lint (pretest); aquí ya se corrió arriba.
      - name: Test
        if: steps.check-node.outputs.found == 'true'
        run: npx jest --ci --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: Upload frontend coverage
        if: always() && steps.check-node.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: src/memory-microfrontend/memory-game/coverage/coverage-summary.json
          if-no-files-found: warn

  coverage:
    name: Validate coverage (85%)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Calculate coverage
        id: coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("coverage-artifacts")
          backend_reports = list(root.rglob("Cobertura.xml"))
          frontend_reports = list(root.rglob("coverage-summary.json"))

          backend_covered = 0
          backend_valid = 0
          for report in backend_reports:
              coverage = ET.parse(report).getroot()
              backend_covered += int(coverage.attrib["lines-covered"])
              backend_valid += int(coverage.attrib["lines-valid"])

          frontend_covered = 0
          frontend_valid = 0
          for report in frontend_reports:
              totals = json.loads(report.read_text())["total"]["lines"]
              frontend_covered += int(totals["covered"])
              frontend_valid += int(totals["total"])

          def percentage(covered, valid):
              return f"{covered / valid * 100:.2f}" if valid else "Unavailable"

          backend = percentage(backend_covered, backend_valid)
          frontend = percentage(frontend_covered, frontend_valid)
          overall = percentage(
              backend_covered + frontend_covered,
              backend_valid + frontend_valid,
          )
          passed = (
              backend != "Unavailable"
              and frontend != "Unavailable"
              and float(backend) >= 85
              and float(frontend) >= 85
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"backend={backend}\n")
              output.write(f"frontend={frontend}\n")
              output.write(f"overall={overall}\n")
              output.write(f"result={'passed' if passed else 'failed'}\n")
          PY

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BACKEND_COVERAGE: ${{ steps.coverage.outputs.backend }}
          FRONTEND_COVERAGE: ${{ steps.coverage.outputs.frontend }}
          OVERALL_COVERAGE: ${{ steps.coverage.outputs.overall }}
          COVERAGE_RESULT: ${{ steps.coverage.outputs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        with:
          script: |
            const marker = '<!-- memory-coverage-report -->';
            const testsPassed =
              process.env.BACKEND_RESULT === 'success' &&
              process.env.FRONTEND_RESULT === 'success';
            const passed =
              process.env.COVERAGE_RESULT === 'passed' && testsPassed;
            const status = passed ? '✅ Passed' : '❌ Failed';
            const formatCoverage = value =>
              value && value !== 'Unavailable' ? `**${value}%**` : 'Unavailable';
            const body = [
              marker,
              '## Coverage report',
              '',
              `- Backend: ${formatCoverage(process.env.BACKEND_COVERAGE)} (required: 85%)`,
              `- Frontend: ${formatCoverage(process.env.FRONTEND_COVERAGE)} (required: 85%)`,
              `- Combined: ${formatCoverage(process.env.OVERALL_COVERAGE)}`,
              `- Validation: **${status}**`,
              '',
              'Coverage must be at least 85% for both backend and frontend; build and test jobs must also pass.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Enforce coverage threshold
        if: always()
        env:
          COVERAGE_RESULT: ${{ steps.coverage.outputs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$COVERAGE_RESULT" != "passed" ]; then
            echo "Coverage must reach 85% for both backend and frontend."
            exit 1
          fi
          if [ "$BACKEND_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Backend and frontend build/test jobs must pass."
            exit 1
          fi
