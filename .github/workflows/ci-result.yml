name: CI Result

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detecta los componentes modificados.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter-pr.outputs.backend || steps.filter-push.outputs.backend }}
      frontend: ${{ steps.filter-pr.outputs.frontend || steps.filter-push.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detección de cambios en Pull Requests.
      - name: Detect changes in Pull Request
        id: filter-pr
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/BattleHub.Memory.Api/**'
              - 'src/BattleHub.Memory.Data/**'
              - 'src/BattleHub.Memory.Domain/**'
              - 'tests/**'
              - 'src/BattleHub.Memory.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'
              - 'docker-compose.yml'
              - '.dockerignore'

            frontend:
              - 'src/memory-microfrontend/**'

      # Detección de cambios en push a main.
      - name: Detect changes in push
        id: filter-push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed-files.txt

          backend=false
          frontend=false

          while IFS= read -r file; do
            case "$file" in
              src/BattleHub.Memory.Api/*|\
              src/BattleHub.Memory.Data/*|\
              src/BattleHub.Memory.Domain/*|\
              tests/*|\
              src/BattleHub.Memory.slnx|\
              Directory.Build.props|\
              Directory.Packages.props|\
              NuGet.config|\
              global.json|\
              docker-compose.yml|\
              .dockerignore)
                backend=true
                ;;
            esac

            case "$file" in
              src/memory-microfrontend/*)
                frontend=true
                ;;
            esac
          done < changed-files.txt

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # Ejecuta el workflow reutilizable del backend.
  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read

  # Ejecuta el workflow reutilizable del frontend.
  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    permissions:
      contents: read

  # Publica o actualiza el comentario de cobertura.
  coverage-comment:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: always() && github.event_name == 'pull_request' && needs.changes.result == 'success'

    steps:
      - name: Comment coverage on pull request
        uses: actions/github-script@v7
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_COVERAGE: ${{ needs.backend.outputs.coverage }}
          FRONTEND_COVERAGE: ${{ needs.frontend.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- memory-coverage-report -->';

            const backendChanged = process.env.BACKEND_CHANGED === 'true';
            const frontendChanged = process.env.FRONTEND_CHANGED === 'true';

            const backendResult = process.env.BACKEND_RESULT;
            const frontendResult = process.env.FRONTEND_RESULT;

            const backendCoverage = process.env.BACKEND_COVERAGE;
            const frontendCoverage = process.env.FRONTEND_COVERAGE;

            function formatComponent(changed, result, coverage) {
              if (!changed) {
                return 'No ejecutado (sin cambios).';
              }

              const value =
                coverage && coverage !== 'Unavailable'
                  ? `**${coverage}%**`
                  : 'No disponible';

              return `${value} (mínimo: 85%) — ${result === 'success' ? 'Correcto' : 'Falló'}`;
            }

            const backendPassed =
              !backendChanged || backendResult === 'success';

            const frontendPassed =
              !frontendChanged || frontendResult === 'success';

            const passed = backendPassed && frontendPassed;

            const body = [
              marker,
              '## Reporte de cobertura',
              '',
              `- Backend: ${formatComponent(backendChanged, backendResult, backendCoverage)}`,
              `- Frontend: ${formatComponent(frontendChanged, frontendResult, frontendCoverage)}`,
              '',
              `- Validación: **${passed ? 'APROBADA' : 'FALLIDA'}**`,
              '',
              'Cada componente ejecutado debe superar sus pruebas y alcanzar al menos un 85% de cobertura.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  # Check final estable para los Pull Requests.
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: always()

    steps:
      - name: Validate CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "No se pudieron detectar los cambios."
            exit 1
          fi

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_RESULT" != "success" ]; then
            echo "El CI del backend falló."
            exit 1
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_RESULT" != "success" ]; then
            echo "El CI del frontend falló."
            exit 1
          fi

          echo "Todas las validaciones de los componentes modificados pasaron."
