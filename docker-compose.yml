# API de Memory + SQL Server + datos de ejemplo + microfrontend. Se levanta con "docker compose up",
# sin pasos previos: el .env es opcional (ver .env.example).
services:
  # Deja la contraseña de sa en el volumen memory-secrets, sin escribirla en el
  # repo. Si .env define MSSQL_SA_PASSWORD se usa esa; si no, se genera una al
  # azar la primera vez y se reutiliza hasta "docker compose down -v".
  sql-password:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        file=/run/memory-secrets/sa_password
        if [ -n "$$MSSQL_SA_PASSWORD" ]; then
          printf '%s' "$$MSSQL_SA_PASSWORD" > "$$file"
        elif [ ! -s "$$file" ]; then
          # SQL Server pide mayúsculas, minúsculas y números.
          until [[ "$$password" =~ [A-Z] && "$$password" =~ [a-z] && "$$password" =~ [0-9] ]]; do
            password=$$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)
          done
          printf '%s' "$$password" > "$$file"
        fi
        # 10001 es el usuario mssql de la imagen de SQL Server.
        chown 10001:0 "$$file"
        chmod 440 "$$file"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    volumes:
      - memory-secrets:/run/memory-secrets

  sql:
    # Misma imagen que usan las pruebas de integración (Testcontainers).
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    depends_on:
      sql-password:
        condition: service_completed_successfully
    # Lee la contraseña del volumen y sigue con el arranque normal de la imagen.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export MSSQL_SA_PASSWORD="$$(cat /run/memory-secrets/sa_password)"
        exec /opt/mssql/bin/permissions_check.sh /opt/mssql/bin/sqlservr
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - memory-sql:/var/opt/mssql
      - memory-secrets:/run/memory-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/memory-secrets/sa_password)\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/BattleHub.Memory.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    ports:
      # Mismo puerto que "dotnet run": el microfrontend no cambia.
      - "5095:8080"
    # La cadena de conexión se arma al arrancar para no dejar la contraseña
    # en la configuración del contenedor.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export ConnectionStrings__MemoryDatabase="Server=sql,1433;Database=BattleHubMemoryDb;User Id=sa;Password=$$(cat /run/memory-secrets/sa_password);TrustServerCertificate=True;MultipleActiveResultSets=true"
        exec dotnet BattleHub.Memory.Api.dll
    volumes:
      - memory-secrets:/run/memory-secrets:ro
    environment:
      # Igual que el perfil "http" de launchSettings.json.
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      # Orígenes permitidos por CORS. Si no están en .env, se usan los locales.
      Cors__Origins__0: ${MEMORY_CORS_SHELL:-http://localhost:4000}
      Cors__Origins__1: ${MEMORY_CORS_FRONTEND:-http://localhost:4003}
    # La API aplica las migraciones antes de escuchar, así que si /health
    # responde ya están aplicadas. La imagen de ASP.NET no trae curl: la
    # petición se hace con bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q Healthy <&3
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Carga las partidas de ejemplo con sqlcmd y docker/sample-data/datos-ejemplo.sql
  # (R-28), aparte de la API. Corre cuando la API ya aplicó las migraciones y
  # termina; si las partidas ya están, no inserta nada.
  sample-data:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "$$(cat /run/memory-secrets/sa_password)" -C -d BattleHubMemoryDb -b -i /sample-data/datos-ejemplo.sql
    volumes:
      - memory-secrets:/run/memory-secrets:ro
      - ./docker/sample-data:/sample-data:ro

  frontend:
    build:
      context: src/memory-microfrontend/memory-game
      args:
        # Dirección de la API vista desde el navegador.
        MEMORY_API_URL: ${MEMORY_API_URL:-http://localhost:5095}
    depends_on:
      - api
    ports:
      # Puerto de Memory según ADR-003: el Shell carga
      # http://localhost:4003/remoteEntry.js.
      - "4003:80"

volumes:
  memory-sql:
  memory-secrets:
