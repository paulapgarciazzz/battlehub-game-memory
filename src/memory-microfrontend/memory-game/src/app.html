<template>
  <require from="./resources/elements/join-screen"></require>
  <require from="./resources/elements/game-board"></require>
  <require from="./resources/elements/result-screen"></require>
  <require from="./app.css"></require>

  <div class="memory-app" style.bind="backgroundStyle">
    <join-screen if.bind="state.phase === 'join' || state.phase === 'waiting-for-opponent'"></join-screen>
    <game-board if.bind="state.phase === 'preview' || state.phase === 'playing'"></game-board>
    <result-screen if.bind="state.phase === 'finished'"></result-screen>
  </div>
</template>
