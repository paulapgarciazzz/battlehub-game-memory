<import from="./turn-indicator"></import>
<import from="./player-tray"></import>
<import from="./memory-card"></import>
<import from="./game-board.css"></import>

<div class="memory-game-board">
  <div class="memory-game-board__overlay" if.bind="state.phase === 'preview'">
    <p>Memorizá las cartas... la partida empieza en unos segundos</p>
  </div>

  <div class="memory-game-board__overlay" if.bind="state.paused && state.phase === 'playing'">
    <p>Juego en pausa. La partida sigue corriendo para tu rival.</p>
  </div>

  <p if.bind="!state.connectionReady">Reconectando con la partida. Espera la actualización del servidor.</p>

  <turn-indicator if.bind="state.phase === 'playing'"></turn-indicator>

  <div class="memory-game-board__layout">
    <player-tray player.bind="myPlayer" is-current-turn.bind="isMyTrayActive"></player-tray>

    <div class="memory-game-board__grid" flip.trigger="onFlip($event)">
      <memory-card repeat.for="card of state.cards" card.bind="card" disabled.bind="isCardDisabled"></memory-card>
    </div>

    <player-tray player.bind="opponentPlayer" is-current-turn.bind="isOpponentTrayActive" mirrored.bind="true"></player-tray>
  </div>
</div>
