<import from="./memory-card.css"></import>

<div class="memory-card ${card.matched ? 'memory-card--matched' : ''} ${disabled ? 'memory-card--disabled' : ''}"
     click.trigger="onClick()">
  <img src.bind="imageSrc" alt.bind="card.faceUp && card.value ? 'Carta ' + card.value : 'Carta boca abajo'">
</div>
