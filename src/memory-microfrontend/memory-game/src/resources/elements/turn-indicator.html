<import from="./turn-indicator.css"></import>

<div class="memory-game-turn-indicator">
  <p class="memory-game-turn-indicator__label">
    Turno de <strong>${state.currentPlayer ? state.currentPlayer.displayName : '...'}</strong>
    <span if.bind="state.isMyTurn"> (¡es tu turno!)</span>
  </p>
  <div class="memory-game-turn-indicator__bar">
    <div class="memory-game-turn-indicator__bar-fill" style="width: ${remainingRatio * 100}%"></div>
  </div>
  <p class="memory-game-turn-indicator__seconds">${remainingSeconds}s</p>
</div>
