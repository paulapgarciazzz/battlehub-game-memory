<import from="./result-screen.css"></import>

<div class="result-screen">
  <h2 if.bind="state.isDraw">¡Empate!</h2>
  <h2 if.bind="!state.isDraw">
    ${amIWinner ? '¡Ganaste!' : (winner ? winner.displayName + ' ganó la partida' : 'Partida finalizada')}
  </h2>

  <ul class="result-screen__scores">
    <li repeat.for="player of state.players">
      ${player.displayName}: ${player.matchedPairs} parejas
    </li>
  </ul>

  <p class="result-screen__save-error" if.bind="state.resultSaveError">
    No se pudo guardar el resultado: ${state.resultSaveError}
    <button type="button" click.trigger="retrySave()">Reintentar</button>
  </p>

  <button type="button" class="result-screen__play-again" click.trigger="playAgain()">Jugar de nuevo</button>
</div>
